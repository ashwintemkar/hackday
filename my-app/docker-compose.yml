version: "3.8"
services:
  postgres:
    # Swapped from plain postgres:15 for lib/pgvector/* (Pinecone's replacement - see
    # ../docker/postgres/pgvector-chunks.sql for the document_chunks table it provisions).
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/pgvector-chunks.sql:/docker-entrypoint-initdb.d/pgvector-chunks.sql:ro
    healthcheck:
      # Was hardcoded to a different project's "chatbot_user"/"db" - fixed to this service's
      # actual env vars so the healthcheck (and anything that depends_on: condition:
      # service_healthy) isn't permanently false.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: